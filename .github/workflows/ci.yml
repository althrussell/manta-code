name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python -m pip install --upgrade pip
      # Install the agent extra too: Manta's control plane (build hook, agent
      # factory, middleware, Databricks tools, memory store) is exercised by the
      # test suite and needs deepagents/langchain/langgraph/databricks at runtime.
      # Agent-dependent tests still `importorskip` so they remain runnable in a
      # bare `.[dev]` environment for quick local checks.
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e '.[dev,agent]'
      - run: pip check
      - run: ruff check .
      - run: pytest

  release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install 'setuptools==84.0.0' 'wheel==0.48.0'
      - run: python -m pip install --no-deps -e '.[dev,agent]'
      - run: python -m pip check
      - name: Build and validate the distributable release
        run: |
          set -euo pipefail
          release_tag="$(python -c 'import tomllib; print("v" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/build_release.py --output-dir "$RUNNER_TEMP/manta-release" --tag "$release_tag"
          cd "$RUNNER_TEMP/manta-release"
          sha256sum --check SHA256SUMS

  # Branch protection requires the exact context `test`, independent of matrix
  # names. Always run this job so a failed/cancelled matrix cannot pass the gate.
  test:
    name: test
    if: ${{ always() }}
    needs: [tests, release-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Require all supported Python checks
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
          ASSET_RESULT: ${{ needs.release-assets.result }}
        run: |
          test "$MATRIX_RESULT" = success
          test "$ASSET_RESULT" = success
