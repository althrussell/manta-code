name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      # Install the agent extra too: Manta's control plane (build hook, agent
      # factory, middleware, Databricks tools, memory store) is exercised by the
      # test suite and needs deepagents/langchain/langgraph/databricks at runtime.
      # Agent-dependent tests still `importorskip` so they remain runnable in a
      # bare `.[dev]` environment for quick local checks.
      - run: pip install -e '.[dev,agent]'
      - run: ruff check .
      - run: pytest
