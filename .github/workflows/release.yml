name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag belongs to remote main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main \
            "+refs/tags/$RELEASE_TAG:refs/manta-release/verified-tag"
          release_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$release_commit" = "$(git rev-parse HEAD)"
          test "$release_commit" = "$(git rev-parse 'refs/manta-release/verified-tag^{commit}')"
          git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install qualified build and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install 'setuptools==84.0.0' 'wheel==0.48.0'
          python -m pip install 'uv==0.11.15'
          python -m pip install --no-deps -e '.[dev,agent]'
          python -m pip check
      - name: Build and validate release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --output-dir dist --tag "$RELEASE_TAG"
      - name: Qualify fresh tagged install and previous-release upgrade
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          qualification_python="$(command -v python)"
          export UV_CACHE_DIR="$RUNNER_TEMP/manta-install-cache"
          export UV_TOOL_DIR="$RUNNER_TEMP/manta-fresh-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/manta-fresh-bin"
          export UV_NO_CONFIG=true UV_PYTHON_DOWNLOADS=never
          export UV_DEFAULT_INDEX=https://pypi.org/simple
          unset UV_INDEX UV_INDEX_URL UV_EXTRA_INDEX_URL PIP_INDEX_URL PIP_EXTRA_INDEX_URL
          export MANTA_HOME="$RUNNER_TEMP/manta-install-state"
          export DEEPAGENTS_HOME="$RUNNER_TEMP/manta-install-runtime"
          mkdir -p "$RUNNER_TEMP/manta-install-project"
          cd "$RUNNER_TEMP/manta-install-project"

          install_tag() {
            uv tool install --force --upgrade --python "$qualification_python" \
              --constraints "https://raw.githubusercontent.com/althrussell/manta-code/$1/requirements-dev.lock" \
              "manta-code[agent] @ git+https://github.com/althrussell/manta-code.git@$1"
          }
          verify_tag() {
            test "$("$UV_TOOL_BIN_DIR/manta" --version)" = "${1#v}"
            uv pip check --python "$UV_TOOL_DIR/manta-code/bin/python"
            "$UV_TOOL_DIR/manta-code/bin/python" -I -c \
              'import sys, manta_code; sys.exit(0 if manta_code.__version__ == sys.argv[1] and not manta_code.__file__.startswith(sys.argv[2]) else "Wrong installed version or source path")' \
              "${1#v}" "$GITHUB_WORKSPACE/"
          }

          install_tag "$RELEASE_TAG"
          verify_tag "$RELEASE_TAG"
          "$UV_TOOL_BIN_DIR/manta" agents --help
          "$UV_TOOL_BIN_DIR/manta" task --help
          "$UV_TOOL_BIN_DIR/manta" runtime mcp --help

          export UV_TOOL_DIR="$RUNNER_TEMP/manta-upgrade-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/manta-upgrade-bin"
          install_tag v0.3.0
          verify_tag v0.3.0
          install_tag v0.4.0
          verify_tag v0.4.0
          install_tag "$RELEASE_TAG"
          verify_tag "$RELEASE_TAG"
          "$UV_TOOL_DIR/manta-code/bin/python" -I -c \
            'import sys; from manta_code.updates import install_method; sys.exit(0 if install_method() == "uv" else "Missing uv install receipt")'
      - name: Publish the verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Recheck the remote ref after CI/build, before changing a draft.
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/manta-release/verified-tag"
          test "$(git rev-parse 'refs/manta-release/verified-tag^{commit}')" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json; then
            python -c 'import json,sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] is True else "Published releases are immutable")'
            gh release edit "$RELEASE_TAG" --target "$RELEASE_COMMIT" \
              --title "Manta $RELEASE_TAG" --notes-file dist/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --target "$RELEASE_COMMIT" --title "Manta $RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi
          # Re-read after draft creation/update. Published releases are never
          # reopened, and a stale pre-merge draft target must not be published.
          gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json
          python -c 'import json,sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] is True else "Published releases are immutable")'
          draft_target="$(python -c 'import json; print(json.load(open("release-state.json"))["targetCommitish"])')"
          # Tag checkouts are detached and need not have a local main branch.
          draft_commit="$(git rev-parse --verify "$draft_target^{commit}" 2>/dev/null || git rev-parse --verify "refs/remotes/origin/$draft_target^{commit}")"
          test "$draft_commit" = "$RELEASE_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          (cd dist && sha256sum --check SHA256SUMS)
          gh release upload "$RELEASE_TAG" --clobber \
            dist/*.whl dist/*.tar.gz dist/requirements-dev.lock \
            dist/release-notes.md dist/SHA256SUMS
          gh release view "$RELEASE_TAG" --json isDraft > release-state.json
          python -c 'import json,sys; sys.exit(0 if json.load(open("release-state.json"))["isDraft"] is True else "Published releases are immutable")'
          git fetch --no-tags origin "+refs/tags/$RELEASE_TAG:refs/manta-release/verified-tag"
          test "$(git rev-parse 'refs/manta-release/verified-tag^{commit}')" = "$RELEASE_COMMIT"
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "Manta $RELEASE_TAG" --notes-file dist/release-notes.md
