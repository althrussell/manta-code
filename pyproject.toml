[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-code"
version = "0.1.0"
description = "Databricks-preconfigured launcher for the deepagents-code coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Al Russell" }]
keywords = ["databricks", "deepagents", "cli", "coding-agent", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/althrussell/manta-code"
Repository = "https://github.com/althrussell/manta-code"
Issues = "https://github.com/althrussell/manta-code/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
agent = [
  # Interactive coding-agent TUI (the `manta` runtime surface). Manta launches
  # this preconfigured for Databricks; we do not fork its model layer.
  #
  # PINNED: Manta's build hook (manta_code.hook) and resolver shim
  # (manta_code.databricks_chat) monkeypatch internal symbols of these packages
  # (deepagents_code.agent.create_deep_agent, deepagents._models.resolve_model).
  # An upstream bump can move those symbols, so we pin exact versions and guard
  # with `manta doctor` + tests/test_reliability.py. Bump deliberately, together.
  "deepagents-code==0.1.7",
  "deepagents==0.6.7",
  # Databricks model + auth: ChatDatabricks is wired into deepagents-code via a
  # `class_path` provider in ~/.deepagents/config.toml; the SDK resolves the
  # active profile from DATABRICKS_CONFIG_PROFILE.
  "databricks-langchain>=0.4",
  "databricks-sdk>=0.40",
  # Used by the launcher to safely merge the Databricks provider into the
  # user's deepagents-code config.toml (tomllib reads, tomli-w writes).
  "tomli-w>=1.0",
]

[project.scripts]
manta = "manta_code.main:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
