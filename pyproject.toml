[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manta-cli"
version = "0.1.0"
description = "Budget-aware multi-model autonomous developer CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manta Team" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
agent = [
  "deepagents>=0.6.8",
  "langchain>=1.0",
  "langgraph>=1.0",
]

[project.scripts]
manta = "manta_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
