# Example .manta/config.toml — copy to .manta/config.toml (or run `manta init`).
# Manta launches the deepagents-code TUI preconfigured for Databricks.

[runtime]
provider = "databricks"

[interactive]
# Databricks Model Serving / Foundation Model API endpoint `manta` launches with.
default_endpoint = "databricks-claude-sonnet-4-5"
# Additional endpoints registered in the deepagents-code `/model` switcher.
extra_endpoints = [
    "databricks-meta-llama-3-3-70b-instruct",
]
