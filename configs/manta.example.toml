# Example .manta/config.toml — copy to .manta/config.toml (or run `manta init`).
# Manta launches the deepagents-code TUI preconfigured for Databricks.

[runtime]
provider = "databricks"

[interactive]
# Exact Unity model-service identity; legacy endpoint names also work.
default_endpoint = "system.ai.gpt-6-luna"
extra_endpoints = [
    "system.ai.claude-opus-5-5",
    "system.ai.gpt-6-1-sol",
    "system.ai.claude-sonnet-5-5",
]

[databricks]
discovery_schemas = ["system.ai"]
service_api = "auto"

[databricks.targets."system.ai.gpt-6-1-sol"]
max_output_tokens = 4096

[databricks.request_tags]
application = "manta-code"
